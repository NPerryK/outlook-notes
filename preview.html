<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email preview</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    @font-face { font-family: "CDF Display"; font-weight: 600; src: url("assets/fonts/barlow-sc-600.woff2") format("woff2"); }
    :root { --deck: #222c37; --cyan: #5cc8ef; --line: #d6dce2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9edf1; color: #17212b; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    header { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: linear-gradient(180deg, #26313d, var(--deck)); color: #e8eef4; box-shadow: 0 4px 12px rgba(13,24,35,.2); }
    header b { font-family: "CDF Display", "Bahnschrift", sans-serif; font-weight: 600; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { font: inherit; font-weight: 600; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid #3d4a58; background: #1a232c; color: #e8eef4; }
    button.primary { background: linear-gradient(180deg, #1d8cbd, #13729c); border-color: #13729c; }
    button:hover { filter: brightness(1.1); }
    main { max-width: 900px; margin: 18px auto; padding: 0 16px 40px; }
    .paper { background: #fff; color: #000; border-radius: 10px; padding: 22px 24px; box-shadow: 0 10px 30px rgba(13,24,35,.12); overflow: auto; }
    .msg { color: #5a6774; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <header>
    <b id="subject">Email preview</b>
    <button id="copy" class="primary" type="button">Copy as table</button>
    <button id="close" type="button">Close</button>
  </header>
  <main>
    <div class="paper" id="paper"><p style="color:#5a6774">Loading…</p></div>
    <div class="msg" id="msg"></div>
  </main>
  <script>
    (function () {
      var data = null;
      function show(d) {
        if (!d || !d.html) return;
        data = d;
        document.getElementById("subject").textContent = d.subject || "Email preview";
        document.getElementById("paper").innerHTML = d.html;   // built and escaped by the add-in
      }
      try { show(JSON.parse(localStorage.getItem("cdfUpdater.preview.v1") || "null")); } catch (e) { /* ignore */ }
      function copy() {
        if (!data) return;
        var done = function (ok) { document.getElementById("msg").textContent = ok ? "Copied — paste it into the email body (Ctrl+V)." : "Copy failed — select the tables and press Ctrl+C."; };
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([data.html], { type: "text/html" }), "text/plain": new Blob([data.text || ""], { type: "text/plain" }) })])
              .then(function () { done(true); }, function () { done(legacy()); });
            return;
          }
        } catch (e) { /* fall through */ }
        done(legacy());
      }
      function legacy() {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("paper"));
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        s.removeAllRanges(); return ok;
      }
      document.getElementById("copy").addEventListener("click", copy);
      document.getElementById("close").addEventListener("click", function () {
        try { Office.context.ui.messageParent("close"); } catch (e) { window.close(); }
      });
      if (window.Office && Office.onReady) Office.onReady(function () {
        try {
          Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, function (arg) {
            try { show(JSON.parse(arg.message)); } catch (e) { /* ignore */ }
          });
          Office.context.ui.messageParent("ready");
        } catch (e) { /* opened outside Office */ }
      });
    })();
  </script>
</body>
</html>
